name: バグ報告
description: バグを報告する
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        以下の情報を記入してください.

  - type: textarea
    id: description
    attributes:
      label: バグの説明
      description: バグの内容を詳しく説明してください.
      placeholder: できるだけ具体的に記述してください
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      description: 本来期待される動作を記述してください.
    validations:
      required: true

  - type: textarea
    id: tex-file
    attributes:
      label: コンパイル対象のTeXファイル
      description: 問題が発生するTeXファイルの内容を貼り付けてください.
      placeholder: |
        \documentclass{...}
        ...
      render: latex
    validations:
      required: true

  - type: textarea
    id: log-file
    attributes:
      label: エラー時のログファイル
      description: コンパイルエラー時のログファイル (`.log`) の内容を貼り付けてください.
      placeholder: ログファイルの内容をここに貼り付けてください
      render: shell
    validations:
      required: true

  - type: input
    id: template-version
    attributes:
      label: テンプレートのバージョン
      description: 使用しているテンプレートのバージョンを記入してください.
      placeholder: 例) v1.0.0
    validations:
      required: true

  - type: dropdown
    id: latex-engine
    attributes:
      label: 使用したLaTeXエンジン
      multiple: false
      options:
        - pdfLaTeX
        - XeLaTeX
        - LuaLaTeX
        - pLaTeX
        - upLaTeX
        - その他
    validations:
      required: true

  - type: input
    id: tex-distribution
    attributes:
      label: TeXディストリビューションおよびバージョン
      description: 使用しているTeXディストリビューションとそのバージョンを記入してください.
      placeholder: 例) TeX Live 2024, MiKTeX 24.1
    validations:
      required: true

  - type: textarea
    id: compile-command
    attributes:
      label: コンパイルコマンド
      description: 使用したコンパイルコマンドを記入してください. latexmkを使用している場合は `.latexmkrc` の内容も含めてください.
      placeholder: |
        例) lualatex main.tex
        
        または .latexmkrc の内容:
        $pdf_mode = 1;
        $pdflatex = 'pdflatex %O %S';
      render: shell
    validations:
      required: true