name: 機能リクエスト
description: 新機能をリクエストする
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        以下の情報を記入してください.

  - type: textarea
    id: problem
    attributes:
      label: 関連する問題
      description: この機能リクエストに関連する問題を説明してください.
      placeholder: 例) 〜の操作が面倒です、〜の機能が不足しています
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策
      description: 考えられる解決策を説明してください.
      placeholder: 具体的な実装方法や使用例があれば記述してください
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 使用例
      description: この機能をどのように使用するか, 具体例を記述してください.
      placeholder: |
        例) 
        \usepackage{newfeature}
        \newcommand{...}
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した他の解決策があれば記述してください.
    validations:
      required: false

  - type: input
    id: template-version
    attributes:
      label: テンプレートのバージョン
      description: 現在使用しているテンプレートのバージョンを記入してください.
      placeholder: 例) v1.0.0
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: その他の情報
      description: スクリーンショットや参考資料などがあれば追加してください.
    validations:
      required: false