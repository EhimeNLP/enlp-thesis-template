name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create distribution folder
        run: |
          mkdir -p dist/enlp-template
          cp -r src/* dist/enlp-template/
          rsync -av --exclude='Makefile' --exclude='README.md' sample/ dist/enlp-template/

      - name: Compress dist
        run: cd dist && zip -r ../enlp-template-${{ github.ref_name }}.zip enlp-template

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: enlp-template-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}